resources:
  - name: detect-auth-type.js
    type: jsc
    content: |
      var token = String(context.getVariable("flow.bearer_token") || "").trim();
      var host = context.getVariable("request.header.host") || "";
      var proto = context.getVariable("client.scheme") || "https";
      context.setVariable("flow.token_issuer", proto + "://" + host);
      if (!token) {
        context.setVariable("flow.auth_type", "none");
      } else {
        var parts = token.split(".");
        if (parts.length === 3) {
          context.setVariable("flow.auth_type", "jwt");
          var aud = "";
          try {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
            var b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/").replace(/=+$/, "");
            var out = "";
            for (var bc = 0, bs = 0, buffer, idx = 0; (buffer = b64.charAt(idx++)); ) {
              var pos = chars.indexOf(buffer);
              if (pos !== -1) {
                bs = bc % 4 ? bs * 64 + pos : pos;
                if (bc++ % 4) out += String.fromCharCode(255 & (bs >> ((-2 * bc) & 6)));
              }
            }
            var payload = JSON.parse(out);
            if (Array.isArray(payload.aud)) {
              aud = String(payload.aud[0] || "");
            } else if (payload.aud) {
              aud = String(payload.aud);
            }
          } catch (e) {}
          context.setVariable("flow.jwt_aud", aud);
        } else {
          context.setVariable("flow.auth_type", "apikey");
          context.setVariable("flow.api_key", token);
        }
      }
  - name: prepare-downstream-from-apikey.js
    type: jsc
    content: |
      var appName = context.getVariable("verifyapikey.VA-VerifyKey.developer.app.name") || "api-key-client";
      context.setVariable("flow.downstream_aud", "ai-platform-multi-region");
      context.setVariable("flow.downstream_sub", String(appName));
      context.setVariable("flow.downstream_scope", "model-access");
  - name: check-model-scope.js
    type: jsc
    content: |
      var scopeRaw = String(context.getVariable("jwt.JWT-VerifyOIDCToken.claim.scope") || "");
      var scopes = scopeRaw.split(/\s+/);
      var hasStarter = false;
      var hasAdvanced = false;
      for (var i = 0; i < scopes.length; i++) {
        if (scopes[i] === "starter-models") hasStarter = true;
        if (scopes[i] === "advanced-models") hasAdvanced = true;
      }

      if (hasAdvanced || hasStarter) {
        var sub = context.getVariable("jwt.JWT-VerifyOIDCToken.claim.subject") ||
                  context.getVariable("flow.jwt_aud") ||
                  "ai-router";
        context.setVariable("flow.has_valid_model_scope", "true");
        context.setVariable("flow.skip_failover", "false");
        context.setVariable("flow.downstream_aud", "ai-platform-multi-region");
        context.setVariable("flow.downstream_sub", String(sub));
        context.setVariable("flow.downstream_scope", "model-access");
      } else {
        context.setVariable("flow.has_valid_model_scope", "false");
        context.setVariable("flow.skip_failover", "true");
      }
  - name: extract-model-name.js
    type: jsc
    content: |
      var raw = context.getVariable("request.content");
      if (raw) {
        try {
          var body = JSON.parse(raw);
          if (body.model) {
            context.setVariable("ai.model", String(body.model));
          }
        } catch (e) {}
      }
  - name: validate-quota-model.js
    type: jsc
    content: |
      var productContent = context.getVariable("verifyapikey.VA-VerifyKey.apiproduct.developer.llmQuota.filteredConfigs");
      var modelName = String(context.getVariable("ai.model") || "").trim();
      context.setVariable("flow.model_not_allowed", "false");

      if (!modelName || !productContent) {
        context.setVariable("flow.model_not_allowed", "true");
        context.setVariable("flow.skip_failover", "true");
      } else {
        var cleanModel = modelName.indexOf("/") !== -1 ? modelName.split("/").pop() : modelName;
        var data = productContent;
        if (typeof productContent === "string") {
          try { data = JSON.parse(productContent); } catch (e) { data = null; }
        } else if (productContent && productContent.asJSON) {
          data = productContent.asJSON;
        }

        var allowed = false;
        var limit = -1;
        if (Array.isArray(data)) {
          for (var i = 0; i < data.length; i++) {
            var entry = data[i];
            if (entry && Array.isArray(entry.llmOperations)) {
              for (var j = 0; j < entry.llmOperations.length; j++) {
                var op = entry.llmOperations[j];
                if (op && op.model) {
                  var opModel = String(op.model);
                  var cleanOpModel = opModel.indexOf("/") !== -1 ? opModel.split("/").pop() : opModel;
                  if (opModel === modelName || cleanOpModel === cleanModel) {
                    allowed = true;
                    if (entry.llmTokenQuota && entry.llmTokenQuota.limit !== undefined && entry.llmTokenQuota.limit !== null && entry.llmTokenQuota.limit !== "") {
                      limit = entry.llmTokenQuota.limit;
                    }
                  }
                }
              }
            }
          }
        }

        if (!allowed) {
          context.setVariable("flow.model_not_allowed", "true");
          context.setVariable("flow.skip_failover", "true");
        } else if (limit !== -1) {
          context.setVariable("ai.modelTokenLimit", String(limit));
        }
      }
  - name: analytics.js
    type: jsc
    content: |
      function safeJsonParse(str) {
        if (!str) return null;
        if (typeof str === "object") return str;
        if (typeof str !== "string") return null;
        var cleaned = str.trim();
        if (cleaned.indexOf("{") !== 0 && cleaned.indexOf("[") !== 0) return null;
        try { return JSON.parse(cleaned); } catch (e1) {
          try { return JSON.parse(cleaned.replace(/\r?\n/g, "\\n")); } catch (e2) { return null; }
        }
      }

      function extractUsageData(contentString) {
        var usageData = {
          model: "",
          requestTokenCount: 0,
          nonCachedRequestTokenCount: 0,
          cachedReadTokenCount: 0,
          cacheWriteTokenCount: 0,
          responseTokenCount: 0,
          totalTokenCount: 0,
          usageFound: false
        };
        if (!contentString) return usageData;
        var cleaned = typeof contentString === "string" ? contentString.trim() : "";
        if (!cleaned && typeof contentString === "object") {
          try { cleaned = JSON.stringify(contentString); } catch (e) { return usageData; }
        }
        if (cleaned.indexOf("[DONE]") !== -1 || cleaned.indexOf("message_stop") !== -1 || cleaned.indexOf("content_block") !== -1 || cleaned.indexOf("event: ping") !== -1) {
          return usageData;
        }
        if (cleaned.indexOf("data:") !== -1) {
          var lines = cleaned.split(/\r?\n/);
          for (var i = lines.length - 1; i >= 0; i--) {
            var l = lines[i].trim();
            if (l.indexOf("data:") === 0) {
              var candidate = l.substring(5).trim();
              if (candidate.indexOf("{") === 0) { cleaned = candidate; break; }
            }
          }
        } else if (cleaned.indexOf("event: ") === 0) {
          var firstBrace = cleaned.indexOf("{");
          if (firstBrace !== -1) cleaned = cleaned.substring(firstBrace).trim();
        }
        if (!cleaned || cleaned.indexOf("{") !== 0) return usageData;
        try {
          var d = JSON.parse(cleaned);
          if (d.model) usageData.model = d.model;
          if (d.modelVersion) usageData.model = d.modelVersion;
          if (d.message && d.message.model) usageData.model = d.message.model;

          if (d.usage && d.usage.prompt_tokens !== undefined) {
            var oaiPrompt = d.usage.prompt_tokens || 0;
            var oaiCached = (d.usage.prompt_tokens_details && d.usage.prompt_tokens_details.cached_tokens) || 0;
            usageData.cachedReadTokenCount = oaiCached;
            usageData.nonCachedRequestTokenCount = Math.max(0, oaiPrompt - oaiCached);
            usageData.requestTokenCount = oaiPrompt;
          }
          if (d.message && d.message.usage && d.message.usage.input_tokens !== undefined) {
            var msgIn = d.message.usage.input_tokens || 0;
            var msgCacheRead = d.message.usage.cache_read_input_tokens || 0;
            var msgCacheWrite = d.message.usage.cache_creation_input_tokens || 0;
            usageData.nonCachedRequestTokenCount = msgIn;
            usageData.cachedReadTokenCount = msgCacheRead;
            usageData.cacheWriteTokenCount = msgCacheWrite;
            usageData.requestTokenCount = msgIn + msgCacheRead + msgCacheWrite;
          }
          if (d.usage && d.usage.input_tokens !== undefined) {
            var uIn = d.usage.input_tokens || 0;
            var uCacheRead = d.usage.cache_read_input_tokens || 0;
            var uCacheWrite = d.usage.cache_creation_input_tokens || 0;
            usageData.nonCachedRequestTokenCount = uIn;
            usageData.cachedReadTokenCount = uCacheRead;
            usageData.cacheWriteTokenCount = uCacheWrite;
            usageData.requestTokenCount = uIn + uCacheRead + uCacheWrite;
          }
          if (d.usageMetadata && d.usageMetadata.promptTokenCount !== undefined) {
            var gPrompt = d.usageMetadata.promptTokenCount || 0;
            var gCached = d.usageMetadata.cachedContentTokenCount || 0;
            usageData.cachedReadTokenCount = gCached;
            usageData.nonCachedRequestTokenCount = Math.max(0, gPrompt - gCached);
            usageData.requestTokenCount = gPrompt;
          }

          if (d.usage && d.usage.completion_tokens !== undefined) usageData.responseTokenCount = d.usage.completion_tokens;
          if (d.message && d.message.usage && d.message.usage.output_tokens !== undefined) usageData.responseTokenCount = d.message.usage.output_tokens;
          if (d.usage && d.usage.output_tokens !== undefined) usageData.responseTokenCount = d.usage.output_tokens;
          if (d.usageMetadata && d.usageMetadata.candidatesTokenCount !== undefined) usageData.responseTokenCount = d.usageMetadata.candidatesTokenCount;

          if (!usageData.responseTokenCount) {
            if (d.usage && d.usage.completion_tokens_details && d.usage.completion_tokens_details.reasoning_tokens !== undefined) {
              usageData.responseTokenCount = d.usage.completion_tokens_details.reasoning_tokens;
            } else if (d.usageMetadata && d.usageMetadata.thoughtsTokenCount !== undefined) {
              usageData.responseTokenCount = d.usageMetadata.thoughtsTokenCount;
            }
          }
          if (usageData.requestTokenCount > 0 || usageData.responseTokenCount > 0) usageData.usageFound = true;
          usageData.totalTokenCount = usageData.requestTokenCount + usageData.responseTokenCount;
        } catch (e) {}
        return usageData;
      }

      var currentFlow = context.getVariable("current.flow.name");
      var type = currentFlow === "EventFlow" ? "streaming" : "non-streaming";
      var contentString = currentFlow === "EventFlow"
        ? context.getVariable("response.event.current.content")
        : context.getVariable("response.content");
      if (!contentString) {
        contentString = context.getVariable("response.content") || context.getVariable("response.event.current.content");
      }

      var prices = safeJsonParse(context.getVariable("ai.prices"));
      if (!prices || !prices["default"]) {
        prices = { "default": { "requestPerMillionTokens": 1, "responsePerMillionTokens": 3, "cachedPerMillionTokens": 0.1 } };
      }
      context.setVariable("ai.responseType", type);

      var usageData = extractUsageData(contentString);
      var modelName = String(context.getVariable("ai.model") || usageData.model || "");
      if (usageData.model) {
        modelName = usageData.model;
        context.setVariable("ai.model", modelName);
      }

      var existingReqTokenCount = context.getVariable("ai.requestTokenCount");
      if (existingReqTokenCount && !usageData.requestTokenCount) {
        usageData.requestTokenCount = parseInt(existingReqTokenCount, 10) || 0;
        usageData.nonCachedRequestTokenCount = usageData.requestTokenCount;
      }

      if (usageData.usageFound) {
        context.setVariable("ai.usageDataFound", "true");
        context.setVariable("ai.promptTokenCount", String(usageData.requestTokenCount));
        context.setVariable("ai.requestTokenCount", String(usageData.requestTokenCount));
        context.setVariable("ai.cachedTokenCount", String(usageData.cachedReadTokenCount));
        context.setVariable("ai.responseTokenCount", String(usageData.responseTokenCount));
        usageData.totalTokenCount = usageData.requestTokenCount + usageData.responseTokenCount;
        context.setVariable("ai.totalTokenCount", String(usageData.totalTokenCount));

        var timeToFirstToken = context.getVariable("ai.timeToFirstToken");
        if (!timeToFirstToken) {
          var reqStart = context.getVariable("client.received.start.timestamp");
          if (reqStart) {
            timeToFirstToken = Date.now() - reqStart;
            context.setVariable("ai.timeToFirstToken", String(timeToFirstToken));
          }
        }

        var costCenter = context.getVariable("ai.costCenter") ||
                         context.getVariable("verifyapikey.VA-VerifyKey.developer.app.name") ||
                         context.getVariable("flow.downstream_sub") ||
                         "unknown";
        context.setVariable("ai.costCenter", String(costCenter));

        var cleanModel = modelName.indexOf("/") !== -1 ? modelName.split("/").pop() : modelName;
        var priceEntry = prices[modelName] || prices[cleanModel] || prices["google/" + cleanModel] || prices["anthropic/" + cleanModel] || prices["default"];
        var reqPrice = parseFloat(priceEntry.requestPerMillionTokens) || 0;
        var cachedPrice = priceEntry.cachedPerMillionTokens !== undefined ? (parseFloat(priceEntry.cachedPerMillionTokens) || 0) : (reqPrice * 0.1);
        var cacheWritePrice = priceEntry.cacheWritePerMillionTokens !== undefined ? (parseFloat(priceEntry.cacheWritePerMillionTokens) || 0) : (reqPrice * 1.25);
        var respPrice = parseFloat(priceEntry.responsePerMillionTokens) || 0;

        var reqCost = (parseFloat(usageData.nonCachedRequestTokenCount) * (reqPrice / 1000000)) +
                      (parseFloat(usageData.cachedReadTokenCount) * (cachedPrice / 1000000)) +
                      (parseFloat(usageData.cacheWriteTokenCount) * (cacheWritePrice / 1000000));
        var respCost = parseFloat(usageData.responseTokenCount) * (respPrice / 1000000);

        context.setVariable("ai.requestCost", String(reqCost));
        context.setVariable("ai.responseCost", String(respCost));
        context.setVariable("ai.totalCost", String(reqCost + respCost));
      } else {
        context.setVariable("ai.usageDataFound", "false");
      }
  - name: reset-usage-data-found.js
    type: jsc
    content: |
      context.setVariable("ai.usageDataFound", "false");
  - name: extract-token-usage.js
    type: jsc
    content: |
      var raw = context.getVariable("response.content");
      if (raw) {
        try {
          var body = JSON.parse(raw);
          if (body.usageMetadata && body.usageMetadata.totalTokenCount !== undefined) {
            context.setVariable("ai.totalTokenCount", String(body.usageMetadata.totalTokenCount));
          } else if (body.usage && body.usage.total_tokens !== undefined) {
            context.setVariable("ai.totalTokenCount", String(body.usage.total_tokens));
          }
        } catch (e) {}
      }
  - name: select-region.js
    type: jsc
    content: |
      var west3Healthy = !context.getVariable("flow.west3_health");
      var west10Healthy = !context.getVariable("flow.west10_health");
      var east1Healthy = !context.getVariable("flow.east1_health");

      var classification = String(context.getVariable("request.header.x-data-classification") || "").toLowerCase();
      var forceEU = (classification === "true" || classification === "high" || classification === "eu");

      var basePath = context.getVariable("proxy.basepath") || "";
      var pathSuffix = context.getVariable("proxy.pathsuffix") || "";
      var isUsEndpoint = (basePath.indexOf("/airouter/us/") !== -1 || basePath.indexOf("/airouter/us-east1/") !== -1);

      if (forceEU && isUsEndpoint) {
        context.setVariable("flow.force_eu", "true");
        context.setVariable("flow.us_not_allowed", "true");
        context.setVariable("flow.short_circuit_503", "true");
        context.setVariable("flow.all_regions_unhealthy", "false");
      } else {
        function pickRandom(list) {
          return list[Math.floor(Math.random() * list.length)];
        }

        var euHealthy = [];
        if (west3Healthy) euHealthy.push("europe-west3");
        if (west10Healthy) euHealthy.push("europe-west10");

        var allHealthy = [];
        if (west3Healthy) allHealthy.push("europe-west3");
        if (west10Healthy) allHealthy.push("europe-west10");
        if (east1Healthy) allHealthy.push("us-east1");

        var allUnavailable = false;
        var selected = "europe-west3";
        if (forceEU || basePath.indexOf("/airouter/eu/") !== -1) {
          if (forceEU && basePath.indexOf("europe-west3") !== -1 && west3Healthy) {
            selected = "europe-west3";
          } else if (forceEU && basePath.indexOf("europe-west10") !== -1 && west10Healthy) {
            selected = "europe-west10";
          } else if (euHealthy.length > 0) {
            selected = pickRandom(euHealthy);
          } else {
            allUnavailable = true;
          }
        } else if (isUsEndpoint) {
          if (east1Healthy) {
            selected = "us-east1";
          } else if (euHealthy.length > 0) {
            selected = pickRandom(euHealthy);
          } else {
            allUnavailable = true;
          }
        } else if (basePath.indexOf("europe-west3") !== -1) {
          if (west3Healthy) {
            selected = "europe-west3";
          } else {
            var alt3 = [];
            if (west10Healthy) alt3.push("europe-west10");
            if (east1Healthy) alt3.push("us-east1");
            if (alt3.length > 0) {
              selected = pickRandom(alt3);
            } else {
              allUnavailable = true;
            }
          }
        } else if (basePath.indexOf("europe-west10") !== -1) {
          if (west10Healthy) {
            selected = "europe-west10";
          } else {
            var alt10 = [];
            if (west3Healthy) alt10.push("europe-west3");
            if (east1Healthy) alt10.push("us-east1");
            if (alt10.length > 0) {
              selected = pickRandom(alt10);
            } else {
              allUnavailable = true;
            }
          }
        } else {
          // global: distribute across all allowed healthy regions
          if (allHealthy.length > 0) {
            selected = pickRandom(allHealthy);
          } else {
            allUnavailable = true;
          }
        }

        var otherCandidates = (forceEU || basePath.indexOf("/airouter/eu/") !== -1)
          ? euHealthy
          : allHealthy;
        var others = [];
        for (var i = 0; i < otherCandidates.length; i++) {
          if (otherCandidates[i] !== selected) others.push(otherCandidates[i]);
        }
        var other = others.length > 0 ? pickRandom(others) : "";

        context.setVariable("flow.force_eu", forceEU ? "true" : "false");
        context.setVariable("flow.us_not_allowed", "false");
        context.setVariable("flow.all_regions_unhealthy", allUnavailable ? "true" : "false");
        context.setVariable("flow.short_circuit_503", allUnavailable ? "true" : "false");
        context.setVariable("flow.selected_region", selected);
        context.setVariable("flow.other_region", other);
        var baseOrigin = (context.getVariable("client.scheme") || "https") + "://" + (context.getVariable("request.header.host") || "api.apigee-bap7.agenticplatform.dev");
        context.setVariable("flow.other_region_url", other ? (baseOrigin + "/airouter/" + other + "/v1" + pathSuffix) : "");
      }
  - name: record-failure.js
    type: jsc
    content: |
      var selected = context.getVariable("flow.selected_region") || "europe-west3";
      var forceEU = context.getVariable("flow.force_eu") === "true";
      var basePath = context.getVariable("proxy.basepath") || "";
      var euOnly = forceEU || basePath.indexOf("/airouter/eu/") !== -1;

      var west3Healthy = !context.getVariable("flow.west3_health") && selected !== "europe-west3";
      var west10Healthy = !context.getVariable("flow.west10_health") && selected !== "europe-west10";
      var east1Healthy = !context.getVariable("flow.east1_health") && selected !== "us-east1";

      var healthyOthers = [];
      if (west3Healthy) healthyOthers.push("europe-west3");
      if (west10Healthy) healthyOthers.push("europe-west10");
      if (!euOnly && east1Healthy) healthyOthers.push("us-east1");

      var other = healthyOthers.length > 0
        ? healthyOthers[Math.floor(Math.random() * healthyOthers.length)]
        : "";
      var allUnavailable = (other === "");

      var pathSuffix = context.getVariable("proxy.pathsuffix") || "";
      var errMsg = context.getVariable("fault.name") ||
                   context.getVariable("error.message") ||
                   "target_error";
      var statusCode = context.getVariable("error.status.code") ||
                       context.getVariable("response.status.code") ||
                       "502";

      var record = {
        healthy: false,
        region: selected,
        lastError: String(errMsg),
        statusCode: String(statusCode),
        timestamp: new Date().toISOString()
      };

      context.setVariable("flow.selected_region", selected);
      context.setVariable("flow.other_region", other);
      context.setVariable("flow.all_regions_unhealthy", allUnavailable ? "true" : "false");
      var baseOrigin = (context.getVariable("client.scheme") || "https") + "://" + (context.getVariable("request.header.host") || "api.apigee-bap7.agenticplatform.dev");
      context.setVariable("flow.other_region_url", other ? (baseOrigin + "/airouter/" + other + "/v1" + pathSuffix) : "");
      context.setVariable("flow.region_error_payload", JSON.stringify(record));
      context.setVariable("response.header.x-region-used", selected);
  - name: parse-prompt-payload.js
    type: jsc
    content: |
      context.setVariable("flow.is_smart_model", "false");
      context.setVariable("flow.has_prompt", "false");
      context.setVariable("flow.has_model", "false");
      context.setVariable("flow.prompt_blocked", "false");

      var screenHeader = String(context.getVariable("request.header.x-screen-prompt") || "").trim().toLowerCase();
      if (screenHeader === "true" || screenHeader === "false") {
        context.setVariable("flow.screen_prompt", screenHeader);
      }
      var maskHeader = String(context.getVariable("request.header.x-mask-prompt") || "").trim().toLowerCase();
      if (maskHeader === "true" || maskHeader === "false") {
        context.setVariable("flow.mask_prompt", maskHeader);
      }
      var raw = context.getVariable("request.content");
      if (raw) {
        try {
          var body = JSON.parse(raw);
          if (body.model) {
            var reqModel = String(body.model).trim();
            context.setVariable("flow.has_model", "true");
            context.setVariable("flow.requested_model", reqModel);
            context.setVariable("flow.override_kvm_key", "override-" + reqModel.replace(/\//g, "--"));
            if (reqModel.toLowerCase().indexOf("smart") === 0) {
              context.setVariable("flow.is_smart_model", "true");
            }
          }
          var promptText = "";
          if (Array.isArray(body.messages) && body.messages.length > 0) {
            for (var i = body.messages.length - 1; i >= 0; i--) {
              if (body.messages[i].role === "user" && body.messages[i].content) {
                promptText = typeof body.messages[i].content === "string"
                  ? body.messages[i].content
                  : JSON.stringify(body.messages[i].content);
                context.setVariable("flow.prompt_msg_index", String(i));
                context.setVariable("flow.prompt_field", "messages");
                break;
              }
            }
          } else if (typeof body.prompt === "string" && body.prompt) {
            promptText = body.prompt;
            context.setVariable("flow.prompt_field", "prompt");
          }
          if (promptText) {
            context.setVariable("flow.prompt_text", promptText);
            context.setVariable("flow.has_prompt", "true");
          }
        } catch (e) {}
      }
  - name: prepare-dlp-request.js
    type: jsc
    content: |
      var promptText = context.getVariable("flow.prompt_text") || "";
      var dlpPayload = {
        item: { value: promptText },
        deidentifyConfig: {
          infoTypeTransformations: {
            transformations: [
              {
                primitiveTransformation: {
                  replaceWithInfoTypeConfig: {}
                }
              }
            ]
          }
        },
        inspectConfig: {
          infoTypes: [
            { name: "EMAIL_ADDRESS" },
            { name: "PHONE_NUMBER" },
            { name: "CREDIT_CARD_NUMBER" },
            { name: "PERSON_NAME" },
            { name: "US_SOCIAL_SECURITY_NUMBER" }
          ]
        }
      };
      context.setVariable("flow.dlp_payload", JSON.stringify(dlpPayload));
  - name: apply-masked-prompt.js
    type: jsc
    content: |
      var status = context.getVariable("dlpResponse.status.code");
      var dlpRaw = context.getVariable("dlpResponse.content");
      if (status == 200 && dlpRaw) {
        try {
          var dlpData = JSON.parse(dlpRaw);
          if (dlpData.item && typeof dlpData.item.value === "string") {
            var masked = dlpData.item.value;
            context.setVariable("flow.prompt_text", masked);
            var reqRaw = context.getVariable("request.content");
            var body = JSON.parse(reqRaw);
            var field = context.getVariable("flow.prompt_field");
            if (field === "messages") {
              var idx = parseInt(context.getVariable("flow.prompt_msg_index"), 10);
              if (!isNaN(idx) && body.messages && body.messages[idx]) {
                body.messages[idx].content = masked;
              }
            } else if (field === "prompt") {
              body.prompt = masked;
            }
            context.setVariable("request.content", JSON.stringify(body));
            context.setVariable("request.header.x-dlp-masked", "true");
          }
        } catch (e) {}
      }
  - name: prepare-model-armor-request.js
    type: jsc
    content: |
      var promptText = context.getVariable("flow.prompt_text") || "";
      var maPayload = {
        userPromptData: {
          text: promptText
        }
      };
      context.setVariable("flow.model_armor_payload", JSON.stringify(maPayload));
  - name: check-model-armor-response.js
    type: jsc
    content: |
      var status = context.getVariable("modelArmorResponse.status.code");
      var raw = context.getVariable("modelArmorResponse.content");
      context.setVariable("flow.prompt_blocked", "false");
      if (status == 200 && raw) {
        try {
          var data = JSON.parse(raw);
          if (data.sanitizationResult && data.sanitizationResult.filterMatchState === "MATCH_FOUND") {
            context.setVariable("flow.prompt_blocked", "true");
          }
        } catch (e) {}
      }
  - name: prepare-smart-router-request.js
    type: jsc
    content: |
      var promptText = context.getVariable("flow.prompt_text") || "";
      var instruction = "Classify the complexity of this prompt for an LLM. Reply with ONLY one word: lite (simple greeting, lookup, short summary), medium (general coding, analysis, writing), or thinking (deep reasoning, math, architecture, multi-step logic).\n\nPrompt: " + promptText;
      var geminiPayload = {
        contents: [
          {
            role: "user",
            parts: [{ text: instruction }]
          }
        ],
        generationConfig: {
          temperature: 0,
          maxOutputTokens: 10
        }
      };
      context.setVariable("flow.smart_router_payload", JSON.stringify(geminiPayload));
  - name: apply-smart-model.js
    type: jsc
    content: |
      var liteModel = String(context.getVariable("flow.lite_model") || "google/gemini-3.5-flash-lite").trim();
      var mediumModel = String(context.getVariable("flow.medium_model") || "google/gemini-4-hydrogen").trim();
      var thinkingModel = String(context.getVariable("flow.thinking_model") || "google/gemini-4-neon").trim();
      var level = "lite";
      var rawClassification = "";

      var status = context.getVariable("smartRouterResponse.status.code");
      var raw = context.getVariable("smartRouterResponse.content");
      if (status == 200 && raw) {
        try {
          var data = JSON.parse(raw);
          rawClassification = (data.candidates && data.candidates[0] && data.candidates[0].content &&
                      data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
                      data.candidates[0].content.parts[0].text || "").trim().toLowerCase();
          if (rawClassification.indexOf("thinking") !== -1) {
            level = "thinking";
          } else if (rawClassification.indexOf("medium") !== -1) {
            level = "medium";
          } else {
            level = "lite";
          }
        } catch (e) {}
      }

      var initialLevel = level;
      var counts = { total: 0, lite: 0, medium: 0, thinking: 0 };
      var countsJson = context.getVariable("flow.smart_counts_json");
      if (countsJson) {
        try {
          var parsed = JSON.parse(countsJson);
          counts.total = parseInt(parsed.total, 10) || 0;
          counts.lite = parseInt(parsed.lite, 10) || 0;
          counts.medium = parseInt(parsed.medium, 10) || 0;
          counts.thinking = parseInt(parsed.thinking, 10) || 0;
        } catch (e) {}
      }

      var litePctStr = String(context.getVariable("flow.lite_percent") || "").trim();
      var mediumPctStr = String(context.getVariable("flow.medium_percent") || "").trim();
      var thinkingPctStr = String(context.getVariable("flow.thinking_percent") || "").trim();
      var litePct = litePctStr !== "" ? parseFloat(litePctStr) : NaN;
      var mediumPct = mediumPctStr !== "" ? parseFloat(mediumPctStr) : NaN;
      var thinkingPct = thinkingPctStr !== "" ? parseFloat(thinkingPctStr) : NaN;

      var newTotal = counts.total + 1;
      var currentThinkingPct = counts.total > 0 ? (counts.thinking / counts.total) * 100 : 0;
      var currentMediumPct = counts.total > 0 ? (counts.medium / counts.total) * 100 : 0;

      var downgradedFrom = "";
      var overrideReason = "none";

      if (level === "thinking" && !isNaN(thinkingPct)) {
        if (currentThinkingPct > thinkingPct) {
          downgradedFrom = "thinking";
          level = "medium";
          overrideReason = "thinking_current_" + currentThinkingPct.toFixed(2) + "_gt_" + thinkingPct;
        }
      }
      if (level === "medium" && !isNaN(mediumPct)) {
        if (currentMediumPct > mediumPct) {
          if (!downgradedFrom) downgradedFrom = "medium";
          level = "lite";
          overrideReason = (overrideReason === "none" ? "" : overrideReason + ";") +
            "medium_current_" + currentMediumPct.toFixed(2) + "_gt_" + mediumPct;
        }
      }

      var chosen = liteModel;
      if (level === "thinking") {
        chosen = thinkingModel;
      } else if (level === "medium") {
        chosen = mediumModel;
      }

      var afterCounts = {
        total: newTotal,
        lite: counts.lite + (level === "lite" ? 1 : 0),
        medium: counts.medium + (level === "medium" ? 1 : 0),
        thinking: counts.thinking + (level === "thinking" ? 1 : 0)
      };

      // Trace & debug variables
      context.setVariable("flow.smart_raw_classification", rawClassification || "none");
      context.setVariable("flow.smart_initial_level", initialLevel);
      context.setVariable("flow.smart_final_level", level);
      context.setVariable("flow.smart_counts_before", JSON.stringify(counts));
      context.setVariable("flow.smart_counts_after", JSON.stringify(afterCounts));
      context.setVariable("flow.smart_pct_config", JSON.stringify({
        lite: isNaN(litePct) ? null : litePct,
        medium: isNaN(mediumPct) ? null : mediumPct,
        thinking: isNaN(thinkingPct) ? null : thinkingPct
      }));
      context.setVariable("flow.smart_current_thinking_pct", currentThinkingPct.toFixed(2));
      context.setVariable("flow.smart_current_medium_pct", currentMediumPct.toFixed(2));
      context.setVariable("flow.smart_override_reason", overrideReason);

      context.setVariable("flow.new_smart_counts_json", JSON.stringify(afterCounts));
      context.setVariable("flow.smart_lite_pct", ((afterCounts.lite / afterCounts.total) * 100).toFixed(2) + "%");
      context.setVariable("flow.smart_medium_pct", ((afterCounts.medium / afterCounts.total) * 100).toFixed(2) + "%");
      context.setVariable("flow.smart_thinking_pct", ((afterCounts.thinking / afterCounts.total) * 100).toFixed(2) + "%");
      context.setVariable("flow.smart_result", chosen);
      context.setVariable("flow.override_kvm_key", "override-" + chosen.replace(/\//g, "--"));
      context.setVariable("flow.has_smart_override", downgradedFrom ? "true" : "false");
      context.setVariable("flow.smart_override", downgradedFrom ? (downgradedFrom + "->" + level) : "false");

      try {
        var reqRaw = context.getVariable("request.content");
        var body = JSON.parse(reqRaw);
        body.model = chosen;
        context.setVariable("request.content", JSON.stringify(body));
        context.setVariable("request.header.x-smart-model-selected", chosen);
        context.setVariable("request.header.x-smart-model-level", level);
        if (downgradedFrom) {
          context.setVariable("request.header.x-smart-model-downgraded-from", downgradedFrom);
        }
      } catch (e) {}
  - name: apply-model-override.js
    type: jsc
    content: |
      var overrideModel = String(context.getVariable("flow.override_model") || "").trim();
      if (overrideModel) {
        try {
          var reqRaw = context.getVariable("request.content");
          var body = JSON.parse(reqRaw);
          var prevModel = body.model || "";
          body.model = overrideModel;
          context.setVariable("request.content", JSON.stringify(body));
          context.setVariable("flow.model_overridden_from", String(prevModel));
          context.setVariable("flow.model_overridden_to", overrideModel);
          context.setVariable("request.header.x-model-override", String(prevModel) + "->" + overrideModel);
          if (context.getVariable("flow.is_smart_model") === "true") {
            context.setVariable("flow.smart_result", overrideModel);
          }
        } catch (e) {}
      }
