policies:
  - name: CORS-AllowAll
    type: CORS
    content:
      CORS:
        metadata:
          name: CORS-AllowAll
        AllowOrigins: "*"
        AllowMethods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        AllowHeaders: "*"
        ExposeHeaders: "*"
        MaxAge: "3600"
        AllowCredentials: "false"
        GeneratePreflightResponse: "true"
  - name: EV-ExtractBearerKey
    type: ExtractVariables
    content:
      ExtractVariables:
        metadata:
          name: EV-ExtractBearerKey
        IgnoreUnresolvedVariables: "true"
        Source: request
        Header:
          - metadata:
              name: Authorization
            Pattern:
              metadata:
                ignoreCase: "true"
              value: "Bearer {flow.bearer_token}"
  - name: JS-DetectAuthType
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-DetectAuthType
          timeLimit: "200"
        ResourceURL: jsc://detect-auth-type.js
  - name: RF-MissingAuth
    type: RaiseFault
    content:
      RaiseFault:
        metadata:
          name: RF-MissingAuth
        FaultResponse:
          Set:
            StatusCode: 401
            ReasonPhrase: Unauthorized
            Headers:
              - Header:
                  metadata:
                    name: Content-Type
                  value: application/json
            Payload:
              metadata:
                contentType: application/json
              value: '{"error":"unauthorized","message":"Missing Authorization Bearer token or API key"}'
  - name: VA-VerifyKey
    type: VerifyAPIKey
    content:
      VerifyAPIKey:
        metadata:
          name: VA-VerifyKey
        APIKey:
          metadata:
            ref: flow.api_key
  - name: JS-ValidateQuotaModel
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ValidateQuotaModel
          timeLimit: "200"
        ResourceURL: jsc://validate-quota-model.js
  - name: RF-ModelNotAllowed
    type: RaiseFault
    content:
      RaiseFault:
        metadata:
          name: RF-ModelNotAllowed
        FaultResponse:
          Set:
            StatusCode: 403
            ReasonPhrase: Forbidden
            Headers:
              - Header:
                  metadata:
                    name: Content-Type
                  value: application/json
            Payload:
              metadata:
                contentType: application/json
              value: '{"error":"forbidden","message":"Model not allowed by API product"}'
  - name: AM-QuotaExhaustion
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-QuotaExhaustion
        Set:
          StatusCode: 429
          ReasonPhrase: Too Many Requests
          Headers:
            - Header:
                metadata:
                  name: Content-Type
                value: application/json
          Payload:
            metadata:
              contentType: application/json
            value: '{"error":"quota_exhausted","message":"LLM token quota exhausted"}'
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: response
  - name: JS-Analytics
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-Analytics
          timeLimit: "200"
        ResourceURL: jsc://analytics.js
  - name: JS-ResetUsageDataFound
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ResetUsageDataFound
          timeLimit: "200"
        ResourceURL: jsc://reset-usage-data-found.js
  - name: DC-TokenAnalytics
    type: DataCapture
    content:
      DataCapture:
        metadata:
          name: DC-TokenAnalytics
          continueOnError: "true"
          enabled: "true"
        DisplayName: DC-TokenAnalytics
        IgnoreUnresolvedVariables: "true"
        Capture:
          - Collect:
              metadata:
                ref: ai.model
                default: unknown
            DataCollector: dc_ai_model
          - Collect:
              metadata:
                ref: ai.promptTokenCount
                default: "0"
            DataCollector: dc_ai_prompt_token_count
          - Collect:
              metadata:
                ref: ai.responseTokenCount
                default: "0"
            DataCollector: dc_ai_response_token_count
          - Collect:
              metadata:
                ref: ai.totalTokenCount
                default: "0"
            DataCollector: dc_ai_total_token_count
          - Collect:
              metadata:
                ref: ai.responseType
                default: unknown
            DataCollector: dc_ai_response_type
          - Collect:
              metadata:
                ref: ai.timeToFirstToken
                default: "0"
            DataCollector: dc_ai_time_first_token
          - Collect:
              metadata:
                ref: ai.costCenter
                default: unknown
            DataCollector: dc_ai_cost_center
          - Collect:
              metadata:
                ref: ai.requestCost
                default: "0"
            DataCollector: dc_ai_request_cost
          - Collect:
              metadata:
                ref: ai.responseCost
                default: "0"
            DataCollector: dc_ai_response_cost
          - Collect:
              metadata:
                ref: ai.totalCost
                default: "0"
            DataCollector: dc_ai_total_cost
  - name: JS-ExtractModelName
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ExtractModelName
          timeLimit: "200"
        ResourceURL: jsc://extract-model-name.js
  - name: JS-ExtractTokenUsage
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ExtractTokenUsage
          timeLimit: "200"
        ResourceURL: jsc://extract-token-usage.js
  - name: LTQ-QuotaEnforce
    type: LLMTokenQuota
    content:
      LLMTokenQuota:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: LTQ-QuotaEnforce
          type: calendar
        DisplayName: LTQ-QuotaEnforce
        Properties: {}
        UseQuotaConfigInAPIProduct:
          metadata:
            stepName: VA-VerifyKey
        EnforceOnly: "true"
        SharedName: llm-quota
        Distributed: "false"
        Synchronous: "false"
        StartTime: 2013-08-21 10:00:00
        AsynchronousConfiguration:
          SyncIntervalInSeconds: "20"
          SyncMessageCount: "5"
        LLMModelSource: "{ai.model}"
  - name: LTQ-QuotaCount
    type: LLMTokenQuota
    content:
      LLMTokenQuota:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: LTQ-QuotaCount
          type: calendar
        DisplayName: LTQ-QuotaCount
        Properties: {}
        UseQuotaConfigInAPIProduct:
          metadata:
            stepName: VA-VerifyKey
        CountOnly: "true"
        SharedName: llm-quota
        Distributed: "false"
        Synchronous: "false"
        StartTime: 2013-08-21 10:00:00
        AsynchronousConfiguration:
          SyncIntervalInSeconds: "20"
          SyncMessageCount: "5"
        LLMTokenUsageSource: "{ai.totalTokenCount}"
        LLMModelSource: "{ai.model}"
  - name: JS-PrepareDownstreamFromApiKey
