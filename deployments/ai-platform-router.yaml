# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: ai-platform-router
displayName: AI Platform Health-Aware Router Proxy
type: proxy
description: Routes global, europe-west3, and europe-west10 endpoints to healthy regional targets with 2-minute cache failover and 307 redirects on fault
categories:
  - ai
  - routing
  - failover
endpoints:
  - name: global
    basePath: /airouter/global/v1
    routes:
      - name: route-west3
        target: europe-west3
        condition: flow.selected_region = "europe-west3"
      - name: route-west10
        target: europe-west10
        condition: flow.selected_region = "europe-west10"
      - name: route-east1
        target: us-east1
        condition: flow.selected_region = "us-east1"
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: CORS-AllowAll
          - name: EV-ExtractBearerKey
          - name: JS-DetectAuthType
          - name: RF-MissingAuth
            condition: flow.auth_type = "none"
          - name: VA-VerifyKey
            condition: flow.auth_type = "apikey"
          - name: JS-ExtractModelName
            condition: flow.auth_type = "apikey"
          - name: JS-ValidateQuotaModel
            condition: (flow.auth_type = "apikey") and (ai.model != null)
          - name: RF-ModelNotAllowed
            condition: (flow.auth_type = "apikey") and (flow.model_not_allowed = "true")
          - name: LTQ-QuotaEnforce
            condition: (flow.auth_type = "apikey") and (ai.modelTokenLimit != null)
          - name: JS-PrepareDownstreamFromApiKey
            condition: flow.auth_type = "apikey"
          - name: KVM-GetSecurityKeys
          - name: JWT-VerifyOIDCToken
            condition: flow.auth_type = "jwt"
          - name: JS-CheckModelScopeAndPrepareDownstream
            condition: flow.auth_type = "jwt"
          - name: RF-InsufficientModelScope
            condition: (flow.auth_type = "jwt") and (flow.has_valid_model_scope != "true")
          - name: JWT-GenerateDownstreamToken
            condition: (flow.auth_type = "apikey") or ((flow.auth_type = "jwt") and (flow.has_valid_model_scope = "true"))
          - name: AM-SetDownstreamBearerToken
            condition: (flow.auth_type = "apikey") or ((flow.auth_type = "jwt") and (flow.has_valid_model_scope = "true"))
          - name: LC-West3Health
          - name: LC-West10Health
          - name: LC-East1Health
          - name: JS-SelectRegion
          - name: RF-USNotAllowed
            condition: flow.us_not_allowed = "true"
          - name: RF-AllRegionsUnavailable
            condition: flow.all_regions_unhealthy = "true"
          - name: KVM-GetAIFlags
          - name: JS-ParsePromptPayload
          - name: JS-PrepareDLPRequest
            condition: (flow.mask_prompt = "true") and (flow.has_prompt = "true")
          - name: SC-CallDLP
            condition: (flow.mask_prompt = "true") and (flow.has_prompt = "true")
          - name: JS-ApplyMaskedPrompt
            condition: (flow.mask_prompt = "true") and (flow.has_prompt = "true")
          - name: JS-PrepareModelArmorRequest
            condition: (flow.screen_prompt = "true") and (flow.has_prompt = "true")
          - name: SC-CallModelArmor
            condition: (flow.screen_prompt = "true") and (flow.has_prompt = "true")
          - name: JS-CheckModelArmorResponse
            condition: (flow.screen_prompt = "true") and (flow.has_prompt = "true")
          - name: RF-PromptBlocked
            condition: flow.prompt_blocked = "true"
          - name: LC-SmartCounts
            condition: (flow.is_smart_model = "true") and (flow.has_prompt = "true")
          - name: JS-PrepareSmartRouterRequest
            condition: (flow.is_smart_model = "true") and (flow.has_prompt = "true")
          - name: SC-CallGeminiSmartRouter
            condition: (flow.is_smart_model = "true") and (flow.has_prompt = "true")
          - name: JS-ApplySmartModel
            condition: (flow.is_smart_model = "true") and (flow.has_prompt = "true")
          - name: PC-SmartCounts
            condition: (flow.is_smart_model = "true") and (flow.has_prompt = "true")
          - name: KVM-GetModelOverride
            condition: flow.has_model = "true"
          - name: JS-ApplyModelOverride
            condition: (flow.has_model = "true") and (flow.override_model != null)
      - name: PostFlow
        mode: Response
        steps:
          - name: AM-SetRegionUsedHeader
            condition: flow.selected_region != null
          - name: AM-SetSmartResultHeader
            condition: flow.is_smart_model = "true"
          - name: AM-SetSmartOverrideHeader
            condition: flow.is_smart_model = "true"
          - name: AM-SetSmartLiteHeader
            condition: flow.is_smart_model = "true"
          - name: AM-SetSmartMediumHeader
            condition: flow.is_smart_model = "true"
          - name: AM-SetSmartThinkingHeader
            condition: flow.is_smart_model = "true"
          - name: JS-Analytics
            condition: response.content != ""
          - name: LTQ-QuotaCount
            condition: (flow.auth_type = "apikey") and (verifyapikey.VA-VerifyKey.apiproduct.developer.llmQuota.limit != null) and (ai.totalTokenCount != null)
          - name: DC-TokenAnalytics
            condition: ai.usageDataFound = "true"
          - name: JS-ResetUsageDataFound
            condition: ai.usageDataFound = "true"
    defaultFaultRule:
      name: DefaultFaultRule
      alwaysEnforce: "true"
      steps:
        - name: JS-RecordRegionFailure
          condition: (flow.prompt_blocked != "true") and (flow.short_circuit_503 != "true") and (flow.skip_failover != "true") and (flow.selected_region != null) and (response.status.code != 401) and (error.status.code != 401) and (response.status.code != 403) and (error.status.code != 403) and (fault.name != "LLMTokenQuotaViolation")
        - name: PC-MarkRegionUnhealthy
          condition: (flow.prompt_blocked != "true") and (flow.short_circuit_503 != "true") and (flow.skip_failover != "true") and (flow.selected_region != null) and (response.status.code != 401) and (error.status.code != 401) and (response.status.code != 403) and (error.status.code != 403) and (fault.name != "LLMTokenQuotaViolation")
        - name: AM-Redirect307
          condition: (flow.prompt_blocked != "true") and (flow.short_circuit_503 != "true") and (flow.all_regions_unhealthy != "true") and (flow.skip_failover != "true") and (flow.selected_region != null) and (response.status.code != 401) and (error.status.code != 401) and (response.status.code != 403) and (error.status.code != 403) and (fault.name != "LLMTokenQuotaViolation")
        - name: RF-AllRegionsUnavailable
          condition: (flow.prompt_blocked != "true") and (flow.short_circuit_503 != "true") and (flow.all_regions_unhealthy = "true") and (flow.skip_failover != "true") and (flow.selected_region != null) and (response.status.code != 401) and (error.status.code != 401) and (response.status.code != 403) and (error.status.code != 403) and (fault.name != "LLMTokenQuotaViolation")
        - name: AM-QuotaExhaustion
          condition: fault.name = "LLMTokenQuotaViolation"
        - name: AM-UnauthorizedModel
          condition: (flow.selected_region != null) and ((response.status.code = 401) or (error.status.code = 401))
