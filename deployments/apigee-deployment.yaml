# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: antigravity-deployment
type: deployment
description: Enterprise AI Gateway deployment for Google Antigravity using REST-AI-Antigravity.
templates:
  - REST-AI-Antigravity.yaml
  - REST-AI-Messages.yaml
products:
  - name: coding-agent-product
    displayName: Coding Agent Product
    type: product
    gateway: apigee
    schemaVersion: 1.0.0
    description: API Product granting access to models for coding agents.
    access: public
    approvalType: auto
    environments:
      - default-dev
    proxies:
      - REST-AI-Antigravity
      - REST-AI-Messages
    quota: "100000"
    quotaInterval: "1"
    quotaTimeUnit: month
    operations:
      - apiSource: REST-AI-Antigravity
        operations:
          - name: /**
            methods: []
            quota: {}
    llmOperations:
      - apiSource: REST-AI-Messages
        operations:
          - name: /
            methods:
              - POST
            model: claude-sonnet-5-5
            llmTokenQuota: {}
      - apiSource: REST-AI-Messages
        operations:
          - name: /
            methods:
              - POST
            model: claude-opus-5-5
            llmTokenQuota: {}
      - apiSource: REST-AI-Messages
        operations:
          - name: /
            methods:
              - POST
            model: claude-haiku-5-5
            llmTokenQuota: {}
users: []
