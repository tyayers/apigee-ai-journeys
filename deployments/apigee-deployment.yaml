# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: antigravity-deployment
type: deployment
description: Enterprise AI Gateway deployment for Google Antigravity using REST-AI-Antigravity.
kvms:
  - name: AI-Demo
    type: environment
    values:
      throttle-europe-west3: "false"
      throttle-europe-west10: "false"
      throttle-us-east1: "false"
      stop-europe-west3: "false"
      stop-europe-west10: "false"
      stop-us-east1: "false"
      stop-mcp: "false"
      lite-model: "google/gemini-3.5-flash-lite"
      medium-model: "google/gemini-4-hydrogen"
      thinking-model: "google/gemini-4-neon"
      lite-model-percent: "80"
      medium-model-percent: "15"
      thinking-model-percent: "5"
      screen-prompt: "false"
      mask-prompt: "false"
      override-google--gemini-4-neon: "google/gemini-4-hydrogen"
      override-google--gemini-4-carbon: "google/gemini-4-hydrogen"
      PriceList: '{"default":{"requestPerMillionTokens":1,"responsePerMillionTokens":3,"cachedPerMillionTokens":0.1},"google/gemini-4-hydrogen":{"requestPerMillionTokens":1.5,"responsePerMillionTokens":7.5,"cachedPerMillionTokens":0.075},"google/gemini-4-neon":{"requestPerMillionTokens":3.0,"responsePerMillionTokens":15.0,"cachedPerMillionTokens":0.15},"google/gemini-4-carbon":{"requestPerMillionTokens":2.0,"responsePerMillionTokens":10.0,"cachedPerMillionTokens":0.1},"google/gemini-4-argon":{"requestPerMillionTokens":2.0,"responsePerMillionTokens":10.0,"cachedPerMillionTokens":0.1},"anthropic/claude-opus-5-5":{"requestPerMillionTokens":4.0,"responsePerMillionTokens":20.0,"cachedPerMillionTokens":0.2,"cacheWritePerMillionTokens":5.0},"anthropic/claude-sonnet-5-5":{"requestPerMillionTokens":2.0,"responsePerMillionTokens":10.0,"cachedPerMillionTokens":0.1,"cacheWritePerMillionTokens":2.5},"anthropic/claude-haiku-5-5":{"requestPerMillionTokens":0.1,"responsePerMillionTokens":0.5,"cachedPerMillionTokens":0.01,"cacheWritePerMillionTokens":0.125}}'
templates: []
proxies:
  - ai-platform-router.yaml
  - ai-platform-multi-region.yaml
  - ai-platform-antigravity.yaml
  - ai-platform-claude.yaml
  - ai-kvm-config.yaml
  - customers-a2a-v1.yaml
  - customers-mcp-v1.yaml
products:
  - name: coding-agent-product
    displayName: Coding Agent Product
    type: product
    gateway: apigee
    schemaVersion: 1.0.0
    description: API Product granting access to models for coding agents.
    access: public
    approvalType: auto
    environments:
      - default-dev
    proxies:
      - REST-AI-Antigravity
      - REST-AI-Messages
      - ai-platform-router
      - ai-platform-multi-region
      - ai-platform-antigravity
      - ai-platform-claude
      - ai-kvm-config
    quota: "100000"
    quotaInterval: "1"
    quotaTimeUnit: month
    operations: []
    llmOperations:
      - apiSource: REST-AI-Messages
        operations:
          - name: /
            methods:
              - POST
            model: claude-sonnet-5-5
            llmTokenQuota:
              limit: "200000"
              interval: "1"
              timeUnit: day
      - apiSource: REST-AI-Messages
        operations:
          - name: /
            methods:
              - POST
            model: claude-opus-5-5
            llmTokenQuota:
              limit: "200000"
              interval: "1"
              timeUnit: day
      - apiSource: REST-AI-Messages
        operations:
          - name: /
            methods:
              - POST
            model: claude-haiku-5-5
            llmTokenQuota: {}
      - apiSource: REST-AI-Antigravity
        operations:
          - name: /
            methods:
              - POST
            model: gemini-3.5-flash-lite
            llmTokenQuota: {}
      - apiSource: REST-AI-Antigravity
        operations:
          - name: /
            methods:
              - POST
            model: gemini-4-carbon
            llmTokenQuota:
              limit: "200000"
              interval: "1"
              timeUnit: day
      - apiSource: REST-AI-Antigravity
        operations:
          - name: /
            methods:
              - POST
            model: gemini-4-neon
            llmTokenQuota:
              limit: "200000"
              interval: "1"
              timeUnit: day
      - apiSource: REST-AI-Antigravity
        operations:
          - name: /
            methods:
              - POST
            model: gemini-4-hydrogen
            llmTokenQuota:
              limit: "200000"
              interval: "1"
              timeUnit: day
      - apiSource: REST-AI-Antigravity
        operations:
          - name: /
            methods:
              - POST
            model: gemini-3.8-flash
            llmTokenQuota:
              limit: "1000"
              interval: "5"
              timeUnit: "minute"
users: []
